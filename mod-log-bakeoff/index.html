<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Log Admin Chat</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --me:#e0f2fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --me:#0c4a6e; } }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100vh; box-sizing:border-box; }
  #log { flex:1; overflow-y:auto; }
  .msg { padding:10px 12px; border-radius:10px; margin:8px 0; white-space:pre-wrap; }
  .me { background:var(--me); margin-left:20%; }
  .bot { border:1px solid var(--line); }
  .status, .metrics { color:var(--muted); font-size:12px; margin:2px 4px; }
  form { display:flex; flex-wrap:wrap; gap:8px; padding-top:8px; }
  input { min-width:200px; }
  input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  select { padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .sql { font:12px ui-monospace, monospace; color:var(--muted); white-space:pre-wrap; margin:2px 4px; }
  button { padding:10px 16px; border-radius:8px; border:0; background:#0369a1; color:#fff; font:inherit; }
</style>
</head>
<body>
<main>
  <div id="log"></div>
  <form id="f"><select id="mode" title="Data-access mode"><option value="typed">typed tools</option><option value="sql">SQL + schema</option><option value="discover">SQL + discovery</option></select><select id="model" title="Model"><option value="haiku">Haiku 5.5</option><option value="sonnet">Sonnet 5.5</option><option value="opus">Opus 5.5</option></select><input id="q" autocomplete="off" placeholder="e.g. Who issued the most bans in October?"><button>Ask</button></form>
</main>
<script>
let convId = null;
const log = document.getElementById('log');
const add = (cls, text='') => { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

document.getElementById('mode').onchange = document.getElementById('model').onchange = () => { convId = null; };
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q'); const text = q.value.trim(); if (!text) return; q.value = '';
  add('msg me', text);
  const status = add('status', 'Thinking…'); const bot = add('msg bot'); const metrics = add('metrics');
  const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:text, conversation_id: convId, mode: document.getElementById('mode').value, model: document.getElementById('model').value }) });
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    let i; while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (.*)/.exec(chunk)?.[1]; const data = JSON.parse(/data: (.*)/.exec(chunk)?.[1] || '{}');
      if (ev === 'start') convId = data.conversation_id;
      if (ev === 'status') status.textContent = data.label;
      if (ev === 'sql') { const s = document.createElement('div'); s.className = 'sql'; s.textContent = data.sql; log.insertBefore(s, bot); }
      if (ev === 'error') { status.textContent = 'Error: ' + data.message; }
      if (ev === 'delta') { status.textContent = ''; bot.textContent += data.text; log.scrollTop = log.scrollHeight; }
      if (ev === 'done') metrics.textContent = `${data.mode} · ${data.model} @${data.effort} · thinking ${data.first_thinking_ms ?? '–'} ms · TTFT ${data.ttft_ms} ms · total ${data.total_ms} ms · ${data.model_requests} model call(s) · tools: ${data.tool_calls.join(', ') || 'none'}`;
    }
  }
};
</script>
</body>
</html>
